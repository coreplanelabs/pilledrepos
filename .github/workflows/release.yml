name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: pilledrepos-release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - name: Verify tag and exact main
        run: |
          node --input-type=module <<'JS'
          import {readFile} from 'node:fs/promises';
          import {checkReleaseContext,currentMain} from './scripts/release-guard.mjs';
          const p=JSON.parse(await readFile('package.json','utf8'));
          if(process.env.GITHUB_REF!=='refs/tags/v'+p.version)throw new Error('Tag/version mismatch');
          checkReleaseContext(process.env,process.env.GITHUB_SHA);
          await currentMain(process.env.GITHUB_SHA);
          JS
        env:
          GH_TOKEN: ${{ github.token }}
  npm:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm install --global npm@11.18.0
      - name: Publish the checked public package with npm OIDC
        run: |
          node --input-type=module <<'JS'
          import {currentMain} from './scripts/release-guard.mjs';
          await currentMain(process.env.GITHUB_SHA);
          JS
          npm publish --access public
        env:
          GH_TOKEN: ${{ github.token }}
  deploy:
    needs: [check, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://pilledrepos.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy exact checked main and verify the public site
        run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ZONE_READ_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_READ_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
