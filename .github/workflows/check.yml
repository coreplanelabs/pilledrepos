name: Check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run typecheck
      - run: bun run test
      - run: node scripts/release-guard.mjs --local
      - run: bun run wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"
      - run: npm pack --dry-run --ignore-scripts

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'coreplanelabs/pilledrepos'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://pilledrepos.com
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: pilledrepos-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: npm install --global npm@11.18.0
      - name: Publish and deploy the exact validated main
        run: |
          node scripts/release.mjs --preflight
          node scripts/publish-package.mjs
          node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_DEPLOY_TOKEN: ${{ secrets.CLOUDFLARE_DEPLOY_TOKEN }}
          CLOUDFLARE_ZONE_READ_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_READ_TOKEN }}
          CLOUDFLARE_INDEX_TOKEN: ${{ secrets.CLOUDFLARE_INDEX_TOKEN }}
          GITHUB_READ_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
          WRANGLER_SEND_METRICS: "false"
