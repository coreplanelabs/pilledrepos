name: Daily index
on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pilledrepos-index
  cancel-in-progress: false
jobs:
  index:
    if: github.repository == 'coreplanelabs/pilledrepos' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.22.2"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: "1.3.0"
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: .data/index
          key: pilledrepos-index-${{ github.run_id }}
          restore-keys: pilledrepos-index-
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Refresh only existing indexed repos
        run: node scripts/ci-index.mjs
        env:
          AI_PILLED_GITHUB_TOKEN: ${{ secrets.GITHUB_READ_TOKEN }}
          CLOUDFLARE_INDEX_TOKEN: ${{ secrets.CLOUDFLARE_INDEX_TOKEN }}
      - name: Update permanent repo metrics
        run: |
          node scripts/release-guard.mjs --local
          node scripts/save-repo-snapshots.mjs --remote --existing-only
          bun run wrangler d1 execute pilledrepos --remote --file=.data/repo-snapshots.sql --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_INDEX_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: efbcecf27f8ef6ef0ceae56a78415cd0
      - name: Publish only a complete verified dataset
        run: node scripts/publish-index.mjs
        env:
          CLOUDFLARE_INDEX_TOKEN: ${{ secrets.CLOUDFLARE_INDEX_TOKEN }}
          CLOUDFLARE_ZONE_READ_TOKEN: ${{ secrets.CLOUDFLARE_ZONE_READ_TOKEN }}
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: always()
        with:
          path: .data/index
          key: pilledrepos-index-${{ github.run_id }}
