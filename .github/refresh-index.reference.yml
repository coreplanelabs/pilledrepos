# Reference only: outside .github/workflows, no scheduler, secrets, or publication.
# Activate only in the chosen independent GitHub repository after resource review.
name: Index reference
permissions:
  contents: read
concurrency:
  group: ai-pilled-index
  cancel-in-progress: false
# Persistent restore/upload and the approved remote publisher must be added first.
steps:
  - run: bun install --frozen-lockfile
  - run: bun run build
  - run: bun run index
    env:
      AI_PILLED_GITHUB_TOKEN: '${{ secrets.AI_PILLED_GITHUB_TOKEN }}'
